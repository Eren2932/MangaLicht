name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          set -euo pipefail
          # Берём ZIP с максимальным номером версии в имени (v4 > (3) > (1)),
          # чтобы старые архивы в репозитории не перебивали новый.
          ZIP=$(python3 - <<'PY'
          import glob, re, os
          def rank(p):
              nums = [int(n) for n in re.findall(r'(\d+)', os.path.basename(p))]
              return (max(nums) if nums else -1, os.path.basename(p))
          z = sorted(glob.glob('*.zip'), key=rank)
          assert z, 'no .zip found in repository root'
          print(z[-1])
          PY
          )
          echo "Using archive: $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          ROOT=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Error summary
        if: steps.build.outcome == 'failure'
        env:
          LOG: build.log
        run: |
          # Каждая ошибка компилятора публикуется как ::error:: -> становится
          # аннотацией check-run и читается через API, без скриншотов.
          python3 - "$LOG" <<'PY'
          import re, sys, os
          log = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          ws = os.environ.get('GITHUB_WORKSPACE', '')
          bar = '|'
          errs, seen = [], set()
          pat = re.compile(r'^e:\s*(?:file://)?(\S+?):(\d+):(\d+)\s*(.*)$', re.M)
          for m in pat.finditer(log):
              f, ln, col, msg = m.group(1), m.group(2), m.group(3), m.group(4).strip()
              rel = f[len(ws):].lstrip('/') if ws and f.startswith(ws) else f.lstrip('/')
              key = (rel, ln, col, msg)
              if key in seen:
                  continue
              seen.add(key)
              errs.append(key)
          for rel, ln, col, msg in errs[:50]:
              safe = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print("::error file=%s,line=%s,col=%s,title=Kotlin::%s" % (rel, ln, col, safe))
          for m in re.finditer(r'^(?:FAILURE:.*|\* What went wrong:|Execution failed for task.*)$', log, re.M):
              print("::error title=Gradle::" + m.group(0).replace('%', '%25'))
          print("")
          print("================ %d KOTLIN ERROR(S) ================" % len(errs))
          for rel, ln, col, msg in errs:
              print("%s:%s:%s  %s" % (rel, ln, col, msg))
          print("===================================================")
          sm = os.environ.get('GITHUB_STEP_SUMMARY')
          if sm:
              with open(sm, 'a', encoding='utf-8') as h:
                  h.write("## Ошибки компиляции: %d\n\n" % len(errs))
                  if errs:
                      h.write("| Файл | Строка | Сообщение |\n|---|---|---|\n")
                      for rel, ln, col, msg in errs:
                          h.write("| `%s` | %s:%s | %s |\n" % (rel, ln, col, msg.replace(bar, ' ')))
                  else:
                      h.write("Строк `e:` в логе нет — смотри полный лог в артефактах.\n")
          PY

      - name: Collect APK
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_ROOT" -path '*/outputs/apk/debug/*.apk' | head -n 1)
          cp "$APK" mangalicht-debug.apk
          ls -lh mangalicht-debug.apk

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mangalicht-APK
          path: mangalicht-debug.apk
          retention-days: 30

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
